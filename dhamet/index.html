<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ظامت — الضامة الموريتانية</title>
<meta name="description" content="ظامت، لعبةُ الأمراء: الضامة الموريتانية في هاتفك. تحدَّ صديقك أونلاين، أو العب ضدّ الذكاء الاصطناعي حتّى بلا إنترنت. مجاناً على Google Play.">
<meta property="og:title" content="ظامت — الضامة الموريتانية">
<meta property="og:description" content="لعبةُ الأمراء في هاتفك — مجاناً على Google Play">
<meta property="og:image" content="https://lemine4400.github.io/dhamet/og.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0f2a1d; --card: #163a28; --gold: #e2b84a; --text: #f4efe2; --muted: #c9c2ae; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Cairo", system-ui, sans-serif; line-height: 1.7; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; text-align: center; }
  .icon { width: 120px; height: 120px; border-radius: 26px; box-shadow: 0 8px 28px rgba(0,0,0,.45); }
  h1 { font-size: 2.2rem; font-weight: 900; margin: 18px 0 2px; color: var(--gold); }
  .tag { margin: 0 0 22px; color: var(--muted); font-size: 1.05rem; }
  ul { list-style: none; padding: 0; margin: 0 auto 26px; max-width: 420px; text-align: right; }
  li { background: var(--card); border-radius: 12px; padding: 10px 14px; margin: 8px 0; font-size: 1.02rem; }
  li::before { content: "✓"; color: var(--gold); font-weight: 900; margin-left: 10px; }
  .cta { display: inline-block; background: var(--gold); color: #1b1407; text-decoration: none; font-weight: 900;
         font-size: 1.25rem; padding: 14px 30px; border-radius: 14px; box-shadow: 0 6px 18px rgba(226,184,74,.35); }
  .cta small { display: block; font-weight: 700; font-size: .8rem; opacity: .8; }
  .note { color: var(--muted); font-size: .85rem; margin-top: 10px; }
  .shots { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 30px -16px 26px; padding: 0 16px 8px; }
  .shots img { width: 200px; height: auto; border-radius: 14px; scroll-snap-align: center; flex: 0 0 auto; }
  footer { color: var(--muted); font-size: .8rem; margin-top: 24px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <img class="icon" src="icon.png" alt="أيقونة ظامت" width="120" height="120">
  <h1>ظامت</h1>
  <p class="tag">لعبةُ الأمراء — الضامةُ الموريتانيّة في هاتفك</p>
  <ul>
    <li>تحدَّ صديقك أونلاين، وغرفتُكما محفوظة 24 ساعة</li>
    <li>العب ضدّ الذكاء الاصطناعي حتّى بلا إنترنت</li>
    <li>بقوانين الظامت الموريتانيّة، ومجاناً</li>
  </ul>
  <a class="cta" id="play" href="https://play.google.com/store/apps/details?id=com.leminestudio.damaonline">
    حمّلها مجاناً<small>من Google Play</small>
  </a>
  <p class="note">لهواتف أندرويد</p>
  <div class="shots">
    <img src="02.jpg" alt="ظامت بقوانين الظامت الموريتانيّة" width="540" height="960">
    <img src="03.jpg" alt="تحدَّ صديقك" width="540" height="960">
    <img src="04.jpg" alt="غرفتُكما محفوظة 24 ساعة" width="540" height="960">
    <img src="05.jpg" alt="ضدّ الذكاء الاصطناعي" width="540" height="960">
  </div>
  <footer><a href="https://lemine4400.github.io/privacy-policy/">سياسة الخصوصيّة</a></footer>
</main>
<script>
  // يمرّر وسمَ الحملة من رابط هذه الصفحة إلى المتجر، فيظهر في Play Console من أين جاء التثبيت.
  (function () {
    var q = new URLSearchParams(location.search), parts = [];
    ["utm_source", "utm_medium", "utm_campaign"].forEach(function (k) {
      var v = (q.get(k) || "").replace(/[^\w.-]/g, "");
      if (v) parts.push(k + "=" + v);
    });
    var ref = parts.length ? parts.join("&") : "utm_source=site&utm_medium=landing";
    document.getElementById("play").href =
      "https://play.google.com/store/apps/details?id=com.leminestudio.damaonline&referrer=" + encodeURIComponent(ref);
  })();
</script>
</body>
</html>
